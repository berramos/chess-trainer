<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Coordinate Trainer - Lichess Style</title>
    <!-- PWA Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Corrected Google Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --bg: #2c3e50;
            --text: #ecf0f1;
            --panel-bg: #34495e;
            --accent: #f1c40f;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        
        body {
            font-family: 'Open Sans', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem 0; /* Vertical padding, 0 horizontal for edge-to-edge board */
        }

        .stats {
            display: flex;
            gap: 3rem;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Responsive Wrapper to maintain square aspect ratio */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px; /* Caps size on desktop */
            aspect-ratio: 1 / 1;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border-radius: 4px;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* New Floating Overlay (Heads-Up Display) */
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: baseline; /* Align targets by text bottom */
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to squares */
            font-family: 'Open Sans', Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-transform: lowercase;
            color: var(--text);
            text-shadow: 0 6px 16px rgba(0, 0, 0, 0.8);
            opacity: 0; /* Hidden initially */
            transition: opacity 0.3s ease;
        }
        
        /* Show overlay when playing or finished */
        #overlay.active { opacity: 1; }

        #target-current {
            font-size: clamp(6rem, 20vw, 12rem); /* Dynamic huge sizing */
            line-height: 1;
            opacity: 0.8; /* Low opacity, eyes see through to board */
            text-align: center;
        }

        #target-next {
            font-size: clamp(1.5rem, 5vw, 3rem); /* Smaller upcoming target */
            opacity: 0.8; /* Slightly higher relative opacity */
            margin-left: 1rem;
            color: var(--accent);
        }

        /* Final Score Display (centered in overlay after game) */
        #overlay.finished {
            flex-direction: column;
            align-items: center;
        }
        
        #overlay.finished #target-next { display: none; }
        
        #overlay.finished #target-current {
            font-size: 5rem;
            opacity: 1; /* High opacity for final result */
            color: var(--accent);
        }

        #board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #1a252f;
            border-radius: 4px;
            box-sizing: border-box;
            z-index: 1;
            transition: border-color 0.2s ease;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }

        #flipBtn { background-color: var(--panel-bg); color: white; }
        #flipBtn:hover { background-color: #2c3e50; }

        /* Settings Panel */
        .settings {
            background-color: var(--panel-bg);
            padding: 1.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-sizing: border-box;
            box-shadow: var(--shadow);
        }

        .settings-title {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 0.5rem;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: 500;
        }

        /* Dual Slider Hack */
        .dual-slider {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 6px;
            background: #1a252f;
            border-radius: 3px;
            z-index: 1;
        }

        .dual-slider input[type="range"] {
            position: absolute;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            pointer-events: none;
            margin: 0;
            z-index: 2;
        }

        .dual-slider input[type="range"]::-webkit-slider-thumb {
            pointer-events: all;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: grab;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .dual-slider input[type="range"]::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .theme-select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            background-color: #1a252f;
            color: var(--text);
            border: 1px solid #2c3e50;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        
        .theme-select:focus {
            outline: 2px solid var(--accent);
        }

        .attribution {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #bdc3c7;
            text-align: center;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .attribution a {
            color: var(--accent);
            text-decoration: none;
        }

        .attribution a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <!-- Wrapping board and overlay together -->
    <div id="game-wrapper">
        <div id="board"></div>
        
        <!-- The floating HUD -->
        <div id="overlay">
            <span id="target-current">Press<br>Start</span>
            <span id="target-next"></span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Start 30s Drill</button>
        <button id="flipBtn">Playing as: White</button>
    </div>

    <div class="settings" style="margin-bottom: 1.5rem;">
        <h3 class="settings-title">Target Scope</h3>
        
        <div class="slider-group">
            <div class="slider-label">
                <span>File Range</span>
                <span id="fileDisplay" style="color: var(--accent)">a to h</span>
            </div>
            <div class="dual-slider">
                <div class="slider-track"></div>
                <input type="range" id="fileMin" min="0" max="7" value="0">
                <input type="range" id="fileMax" min="0" max="7" value="7">
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">
                <span>Rank Range</span>
                <span id="rankDisplay" style="color: var(--accent)">1 to 8</span>
            </div>
            <div class="dual-slider">
                <div class="slider-track"></div>
                <input type="range" id="rankMin" min="0" max="7" value="0">
                <input type="range" id="rankMax" min="0" max="7" value="7">
            </div>
        </div>
    </div>

    <div class="settings">
        <h3 class="settings-title">Settings</h3>
        
        <div class="slider-group">
            <div class="slider-label">
                <span>Board Theme</span>
            </div>
            <select id="themeSelect" class="theme-select">
                <option value="wood">Wood (Default)</option>
                <option value="green">Classic Green</option>
                <option value="blue">Ocean Blue</option>
                <option value="grey">Monochrome</option>
            </select>
        </div>
    </div>

    <div class="attribution">
        HUD style inspired by Lichess.<br>
        Horse Icon by Deni Sudibyo from <a href="https://thenounproject.com/browse/icons/term/horse/" target="_blank" title="Horse Icons">Noun Project</a> (CC BY 3.0).<br>
        <a href="https://your-donation-link.com" target="_blank" title="Help cover the custom domain name">Help cover domain costs.</a>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        
        // New HUD elements
        const overlayEl = document.getElementById('overlay');
        const currentTargetEl = document.getElementById('target-current');
        const nextTargetEl = document.getElementById('target-next');
        
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const flipBtn = document.getElementById('flipBtn');

        // Sliders and Displays
        const fileMinSlider = document.getElementById('fileMin');
        const fileMaxSlider = document.getElementById('fileMax');
        const rankMinSlider = document.getElementById('rankMin');
        const rankMaxSlider = document.getElementById('rankMax');
        const fileDisplay = document.getElementById('fileDisplay');
        const rankDisplay = document.getElementById('rankDisplay');
        const themeSelect = document.getElementById('themeSelect');

        const allFiles = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const allRanks = ['1', '2', '3', '4', '5', '6', '7', '8'];

        // Dynamic Scope Arrays
        let activeFiles = [...allFiles];
        let activeRanks = [...allRanks];

        let isWhiteBottom = true;
        
        // Target tracking state
        let currentTargetCoord = '';
        let upcomingTargetCoord = '';
        
        let score = 0;
        let timeLeft = 30;
        let timer = null;
        let playing = false;

        // --- Settings Logic ---
        function updateScope() {
            // Get values and sort them to handle thumbs crossing over each other
            const f1 = parseInt(fileMinSlider.value);
            const f2 = parseInt(fileMaxSlider.value);
            const r1 = parseInt(rankMinSlider.value);
            const r2 = parseInt(rankMaxSlider.value);

            const fStart = Math.min(f1, f2);
            const fEnd = Math.max(f1, f2);
            const rStart = Math.min(r1, r2);
            const rEnd = Math.max(r1, r2);

            // Update UI Labels
            fileDisplay.textContent = `${allFiles[fStart]} to ${allFiles[fEnd]}`;
            rankDisplay.textContent = `${allRanks[rStart]} to ${allRanks[rEnd]}`;

            // Update Arrays used for targets
            activeFiles = allFiles.slice(fStart, fEnd + 1);
            activeRanks = allRanks.slice(rStart, rEnd + 1);
        }

        // --- Theme Logic ---
        const themes = {
            wood: { light: '#f0d9b5', dark: '#b58863' },
            green: { light: '#eeeed2', dark: '#769656' }, // Popular Lichess/Chess.com green
            blue: { light: '#dee3e6', dark: '#8ca2ad' },
            grey: { light: '#c8c8c8', dark: '#818181' }
        };

        themeSelect.addEventListener('change', (e) => {
            const theme = themes[e.target.value];
            document.documentElement.style.setProperty('--light-sq', theme.light);
            document.documentElement.style.setProperty('--dark-sq', theme.dark);
        });

        // Attach listeners to all 4 inputs
        [fileMinSlider, fileMaxSlider, rankMinSlider, rankMaxSlider].forEach(slider => {
            slider.addEventListener('input', updateScope);
        });

        // --- Board Logic ---
        function renderBoard() {
            boardEl.innerHTML = '';
            
            const displayRanks = isWhiteBottom ? [...allRanks].reverse() : allRanks;
            const displayFiles = isWhiteBottom ? allFiles : [...allFiles].reverse();

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const rank = displayRanks[r];
                    const file = displayFiles[f];
                    const coord = file + rank;
                    
                    const square = document.createElement('div');
                    // Color logic is absolute based on board rules, 
                    // not visual position relative to top left.
                    const fileIndex = allFiles.indexOf(file);
                    const rankIndex = parseInt(rank) - 1;
                    const isLight = (fileIndex + rankIndex) % 2 !== 0;
                    
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.coord = coord;
                    
                    square.addEventListener('click', () => handleGuess(coord));
                    boardEl.appendChild(square);
                }
            }
        }

        function getRandomCoord() {
            const f = activeFiles[Math.floor(Math.random() * activeFiles.length)];
            const r = activeRanks[Math.floor(Math.random() * activeRanks.length)];
            return f + r;
        }

        function updateHUD() {
            currentTargetEl.textContent = currentTargetCoord;
            nextTargetEl.textContent = upcomingTargetCoord;
        }

        function nextTarget() {
            // First run initialisation
            if (!currentTargetCoord && !upcomingTargetCoord) {
                currentTargetCoord = getRandomCoord();
                upcomingTargetCoord = getRandomCoord();
            } else {
                // Shift upcoming to current, generate new upcoming
                currentTargetCoord = upcomingTargetCoord;
                
                // Keep generating until we get a different upcoming coordinate (avoid repeats)
                let newCoord = getRandomCoord();
                while (newCoord === currentTargetCoord && activeFiles.length * activeRanks.length > 1) {
                    newCoord = getRandomCoord();
                }
                upcomingTargetCoord = newCoord;
            }
            updateHUD();
        }

        function handleGuess(coord) {
            if (!playing) return;
            
            if (coord === currentTargetCoord) {
                score++;
                scoreEl.textContent = score;
                nextTarget();
            } else {
                // Wrong guess - flash border red
                boardEl.style.borderColor = '#e74c3c';
                setTimeout(() => {
                    boardEl.style.borderColor = '#1a252f';
                }, 150);
            }
        }

        // --- Game Controls ---
        function startGame() {
            // Reset state
            score = 0;
            timeLeft = 30;
            playing = true;
            currentTargetCoord = '';
            upcomingTargetCoord = '';
            
            // Clean up HUD styling (remove finished state if restart)
            overlayEl.className = 'active'; // Just "active" hides final score look
            
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            startBtn.textContent = 'Restart Drill';
            boardEl.style.borderColor = '#3498db'; // Active game border
            
            // Initialise targets
            nextTarget();

            // Run timer
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            playing = false;
            clearInterval(timer);
            startBtn.textContent = 'Play Again';
            
            // Transition HUD to "Finished" state to show final score clearly
            overlayEl.className = 'active finished';
            currentTargetEl.innerHTML = `Score<br>${score}`;
            nextTargetEl.textContent = "";
            
            boardEl.style.borderColor = '#1a252f'; // Neutral border
        }

        flipBtn.addEventListener('click', () => {
            isWhiteBottom = !isWhiteBottom;
            flipBtn.textContent = `Playing as: ${isWhiteBottom ? 'White' : 'Black'}`;
            renderBoard();
        });

        startBtn.addEventListener('click', startGame);

        // --- PWA Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Initialize
        updateScope();
        renderBoard();
    </script>
</body>
</html>
