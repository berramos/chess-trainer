<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Coordinate Trainer - Custom Scope</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --bg: #2c3e50;
            --text: #ecf0f1;
            --panel-bg: #34495e;
            --accent: #f1c40f;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .stats {
            display: flex;
            gap: 3rem;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .target {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 2rem;
            height: 4.5rem;
            color: var(--accent);
            text-transform: lowercase;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, min(10vw, 60px));
            grid-template-rows: repeat(8, min(10vw, 60px));
            border: 4px solid #1a252f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .square:active {
            opacity: 0.6;
        }

        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }

        #flipBtn { background-color: var(--panel-bg); color: white; }
        #flipBtn:hover { background-color: #2c3e50; }

        /* Settings Panel */
        .settings {
            margin-top: 2rem;
            background-color: var(--panel-bg);
            padding: 1.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-sizing: border-box;
        }

        .settings-title {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 0.5rem;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: 500;
        }

        /* Dual Slider Hack */
        .dual-slider {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 6px;
            background: #1a252f;
            border-radius: 3px;
            z-index: 1;
        }

        .dual-slider input[type="range"] {
            position: absolute;
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            pointer-events: none;
            margin: 0;
            z-index: 2;
        }

        .dual-slider input[type="range"]::-webkit-slider-thumb {
            pointer-events: all;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: grab;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .dual-slider input[type="range"]::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.1);
        }
        .attribution {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #bdc3c7;
        text-align: center;
        }

        .attribution a {
            color: var(--accent);
            text-decoration: none;
        }

        .attribution a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <div class="target" id="target">Press Start</div>

    <div id="board"></div>

    <div class="controls">
        <button id="startBtn">Start 30s Drill</button>
        <button id="flipBtn">Playing as: White</button>
    </div>

    <div class="settings">
        <h3 class="settings-title">Target Scope</h3>
        
        <div class="slider-group">
            <div class="slider-label">
                <span>File Range</span>
                <span id="fileDisplay" style="color: var(--accent)">a to h</span>
            </div>
            <div class="dual-slider">
                <div class="slider-track"></div>
                <input type="range" id="fileMin" min="0" max="7" value="0">
                <input type="range" id="fileMax" min="0" max="7" value="7">
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">
                <span>Rank Range</span>
                <span id="rankDisplay" style="color: var(--accent)">1 to 8</span>
            </div>
            <div class="dual-slider">
                <div class="slider-track"></div>
                <input type="range" id="rankMin" min="0" max="7" value="0">
                <input type="range" id="rankMax" min="0" max="7" value="7">
            </div>
        </div>
    </div>
    <div class="attribution">
        Horse Icon by Deni Sudibyo from <a href="https://thenounproject.com/browse/icons/term/horse/" target="_blank" title="Horse Icons">Noun Project</a> (CC BY 3.0)
    </div>
    <script>
        const boardEl = document.getElementById('board');
        const targetEl = document.getElementById('target');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const flipBtn = document.getElementById('flipBtn');

        // Sliders and Displays
        const fileMinSlider = document.getElementById('fileMin');
        const fileMaxSlider = document.getElementById('fileMax');
        const rankMinSlider = document.getElementById('rankMin');
        const rankMaxSlider = document.getElementById('rankMax');
        const fileDisplay = document.getElementById('fileDisplay');
        const rankDisplay = document.getElementById('rankDisplay');

        const allFiles = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const allRanks = ['1', '2', '3', '4', '5', '6', '7', '8'];

        // Dynamic Scope Arrays
        let activeFiles = [...allFiles];
        let activeRanks = [...allRanks];

        let isWhiteBottom = true;
        let currentTarget = '';
        let score = 0;
        let timeLeft = 30;
        let timer = null;
        let playing = false;

        // --- Settings Logic ---
        function updateScope() {
            // Get values and sort them to handle thumbs crossing over each other
            const f1 = parseInt(fileMinSlider.value);
            const f2 = parseInt(fileMaxSlider.value);
            const r1 = parseInt(rankMinSlider.value);
            const r2 = parseInt(rankMaxSlider.value);

            const fStart = Math.min(f1, f2);
            const fEnd = Math.max(f1, f2);
            const rStart = Math.min(r1, r2);
            const rEnd = Math.max(r1, r2);

            // Update UI Labels
            fileDisplay.textContent = `${allFiles[fStart]} to ${allFiles[fEnd]}`;
            rankDisplay.textContent = `${allRanks[rStart]} to ${allRanks[rEnd]}`;

            // Update Arrays used for targets
            activeFiles = allFiles.slice(fStart, fEnd + 1);
            activeRanks = allRanks.slice(rStart, rEnd + 1);
        }

        // Attach listeners to all 4 inputs
        [fileMinSlider, fileMaxSlider, rankMinSlider, rankMaxSlider].forEach(slider => {
            slider.addEventListener('input', updateScope);
        });

        // --- Board Logic ---
        function renderBoard() {
            boardEl.innerHTML = '';
            
            const displayRanks = isWhiteBottom ? [...allRanks].reverse() : allRanks;
            const displayFiles = isWhiteBottom ? allFiles : [...allFiles].reverse();

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const rank = displayRanks[r];
                    const file = displayFiles[f];
                    const coord = file + rank;
                    
                    const square = document.createElement('div');
                    const isLight = (r + f) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.coord = coord;
                    
                    square.addEventListener('click', () => handleGuess(coord));
                    boardEl.appendChild(square);
                }
            }
        }

        function getRandomCoord() {
            const f = activeFiles[Math.floor(Math.random() * activeFiles.length)];
            const r = activeRanks[Math.floor(Math.random() * activeRanks.length)];
            return f + r;
        }

        function nextTarget() {
            currentTarget = getRandomCoord();
            targetEl.textContent = currentTarget;
        }

        function handleGuess(coord) {
            if (!playing) return;
            
            if (coord === currentTarget) {
                score++;
                scoreEl.textContent = score;
                nextTarget();
            } else {
                boardEl.style.borderColor = '#e74c3c';
                setTimeout(() => {
                    boardEl.style.borderColor = '#3498db';
                }, 150);
            }
        }

        // --- Game Controls ---
        function startGame() {
            score = 0;
            timeLeft = 30;
            playing = true;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            startBtn.textContent = 'Restart Drill';
            boardEl.style.borderColor = '#3498db';
            
            nextTarget();

            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            playing = false;
            clearInterval(timer);
            targetEl.textContent = `Score: ${score}`;
            boardEl.style.borderColor = '#1a252f';
        }

        flipBtn.addEventListener('click', () => {
            isWhiteBottom = !isWhiteBottom;
            flipBtn.textContent = `Playing as: ${isWhiteBottom ? 'White' : 'Black'}`;
            renderBoard();
        });

        startBtn.addEventListener('click', startGame);

        // Initialize
        updateScope();
        renderBoard();
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        })
        .catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
    });
  }
</script>
</body>
</html>
